<!-- Supabase → Authentication → Emails → "Reset password". Subject: Reset your Maximus staff password -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 520px; margin: 0 auto; color: #0f1b2d">
  <div style="background: #141543; padding: 20px 24px; border-radius: 12px 12px 0 0">
    <span style="color: #ffcc08; font-weight: 800; letter-spacing: 2px; font-size: 18px">MAXIMUS COLLECTIBLES</span>
  </div>
  <div style="border: 1px solid #e2e7ef; border-top: 0; padding: 24px; border-radius: 0 0 12px 12px">
    <h2 style="margin: 0 0 12px; color: #141543">Reset your password</h2>
    <p style="margin: 0 0 20px; line-height: 1.5">
      Click the button below to choose a new password. This link can only be used once.
    </p>
    <a
      href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/staff/set-password"
      style="display: inline-block; background: #1e2e67; color: #ffffff; padding: 12px 22px; border-radius: 8px; text-decoration: none; font-weight: 700"
      >Choose a new password</a
    >
    <p style="margin: 20px 0 0; font-size: 12px; color: #5b6578">
      If you didn't ask for this, you can ignore this email — your password won't change.
    </p>
  </div>
</div>
